[workspace]
resolver = "3"
members = ["crates/*"]
# Experimental Cranelift bridge: its own workspace and lock file, so default and
# offline/locked builds never fetch or compile Cranelift. See its README.
exclude = ["crates/keel-cranelift", "third-party/bbtree"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
profiling = { version = "1.0", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
redundant_clone = "warn"
dbg_macro = "warn"

# Release plus whole-program optimization, for installed or shipped compilers.
# Cuts retired instructions a further 2-5% on the compile-time corpus, at
# roughly 2.5x the clean build time of `release`.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

# Faster execution of compiler/assembler matrices without disabling test checks.
# Opt in with `cargo test --profile test-fast`; the default test profile stays intact.
[profile.test-fast]
inherits = "test"
opt-level = 2
debug = 1
debug-assertions = true
overflow-checks = true

[package]
name = "keel-asm"
description = "Keel AArch64 Mach-O and x86-64 ELF assemblers"
version.workspace = true
edition.workspace = true
license = "(MIT OR Apache-2.0) AND BSD-3-Clause"

[dependencies]
keel-asm-ir = { path = "../keel-asm-ir" }
memchr = "2"
object = { version = "0.36", default-features = false, features = ["write", "std"] }
bumpalo = { version = "3", features = ["collections"] }

[dev-dependencies]
serde_json = "1"
object = { version = "0.36", default-features = false, features = ["read", "std"] }
keel-codegen = { path = "../keel-codegen" }
keel-ir = { path = "../keel-ir" }
keel-opt = { path = "../keel-opt" }
keel-c = { path = "../keel-c" }

[features]
experimental-regalloc = ["keel-codegen/experimental-regalloc"]
backend-profile = ["keel-codegen/backend-profile"]

[[example]]
name = "profile_backend"
required-features = ["backend-profile"]

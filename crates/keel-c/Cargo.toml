[package]
name = "keel-c"
description = "A C frontend for keel: native preprocessing and C to keel IR"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Stage timing helpers; absent from normal compiler builds.
profile = []

[[example]]
name = "profile_frontend"
required-features = ["profile"]

[dependencies]
rayon = "1"
memchr = "2"
smallvec = "1"
bumpalo = { version = "3", features = ["collections"] }
typed-arena = "2"
memmap2 = "0.9"
simdutf8 = "0.1"
keel-ir = { path = "../keel-ir" }
keel-frontend = { path = "../keel-frontend" }
keel-opt = { path = "../keel-opt" }

[dev-dependencies]
keel-wasm = { path = "../keel-wasm" }
keel-codegen = { path = "../keel-codegen" }
keel-asm = { path = "../keel-asm" }
keel-link = { path = "../keel-link" }
object = { version = "0.36", default-features = false, features = ["read", "std"] }

[lints]
workspace = true

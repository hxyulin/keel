[package]
name = "keel-codegen"
description = "Keel instruction selection, register allocation and AArch64 and x86-64 emission"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
experimental-regalloc = []
experimental-dispatch = []
backend-profile = []
profile-with-tracy = ["profiling/profile-with-tracy"]

[dependencies]
keel-asm = { path = "../keel-asm" }
keel-asm-ir = { path = "../keel-asm-ir" }
profiling.workspace = true
keel-ir = { path = "../keel-ir" }
keel-util = { path = "../keel-util" }

[dev-dependencies]
keel-opt = { path = "../keel-opt" }
keel-test-support = { path = "../keel-test-support" }
object = { version = "0.36", default-features = false, features = ["read", "std"] }

# Default builds skip this binary instead of linking an empty one.
[[test]]
name = "arm_dispatch_tail"
required-features = ["experimental-dispatch"]

[lints]
workspace = true

[package]
name = "keel-codegen"
description = "Keel machine code generation"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
experimental-regalloc = []
experimental-dispatch = []
backend-profile = []
profile-with-tracy = ["profiling/profile-with-tracy"]

[dependencies]
keel-asm-ir = { path = "../keel-asm-ir" }
profiling.workspace = true
keel-ir = { path = "../keel-ir" }

[dev-dependencies]
keel-asm = { path = "../keel-asm" }
keel-opt = { path = "../keel-opt" }
object = { version = "0.36", default-features = false, features = ["read", "std"] }

[lints]
workspace = true

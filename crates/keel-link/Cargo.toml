[package]
name = "keel-link"
description = "Native Mach-O and ELF linkers for arm64 macOS, AArch64 Linux and x86-64 Linux"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
keel-object = { path = "../keel-object" }
keel-asm-ir = { path = "../keel-asm-ir" }
keel-util = { path = "../keel-util" }
object = { version = "0.36", default-features = false, features = ["read", "std"] }
sha2 = "0.11.1"
serde = "1"
serde_yaml = "0.9"

[dev-dependencies]
keel-asm = { path = "../keel-asm" }
keel-test-support = { path = "../keel-test-support" }

[lints]
workspace = true

[package]
name = "keel"
description = "Keel command-line driver"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
verify-each = ["keel-opt/verify-each"]
experimental-regalloc = ["keel-codegen/experimental-regalloc"]
profile-with-tracy = ["profiling/profile-with-tracy", "keel-opt/profile-with-tracy", "keel-codegen/profile-with-tracy", "dep:tracy-client"]

[dependencies]
memmap2 = "0.9"
simdutf8 = "0.1"
profiling.workspace = true
tracy-client = { version = "0.18", optional = true }

keel-ir = { path = "../keel-ir" }
keel-c = { path = "../keel-c" }
keel-codegen = { path = "../keel-codegen" }
keel-opt = { path = "../keel-opt" }
keel-asm = { path = "../keel-asm" }
keel-link = { path = "../keel-link" }

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="247" viewBox="0 0 720 247" role="img" aria-labelledby="assembly-t assembly-d">
<style>
svg{--surface:#fff;--ink:#000;--ink-2:#525252;--grid:#e5e5e5;--keel:#0056d6;--other:#737373;--on-blue:#fff}
@media (prefers-color-scheme:dark){svg{--surface:#000;--ink:#fff;--ink-2:#a3a3a3;--grid:#262626;--keel:#5b9dff;--other:#737373;--on-blue:#000}}
text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;fill:var(--ink)}
.muted{fill:var(--ink-2)}
.number{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums}
</style>
<title id="assembly-t">Assembly to Mach-O object (lower is better)</title>
<desc id="assembly-d">keel asm: 7.18 ms; clang -cc1as: 19.6 ms; clang -c: 26.3 ms. keel asm is 2.7× faster than clang -cc1as. Apple M5 Max · macOS, median of 7 runs.</desc>
<rect width="720" height="247" fill="var(--surface)"/>
<text x="26" y="44" font-size="21" font-weight="680">Assembly to Mach-O object</text>
<text class="muted" x="26" y="66" font-size="13">Apple M5 Max · macOS · median of 7 runs</text>
<text class="number" x="694" y="43" font-size="23" font-weight="700" text-anchor="end">2.73× faster</text>
<text class="muted" x="694" y="64" font-size="11" text-anchor="end">keel asm vs clang -cc1as</text>
<path d="M178.0 86V194" stroke="var(--grid)"/>
<text class="muted number" x="178.0" y="211" font-size="12" text-anchor="middle">0</text>
<path d="M322.7 86V194" stroke="var(--grid)"/>
<text class="muted number" x="322.7" y="211" font-size="12" text-anchor="middle">10</text>
<path d="M467.3 86V194" stroke="var(--grid)"/>
<text class="muted number" x="467.3" y="211" font-size="12" text-anchor="middle">20</text>
<path d="M612.0 86V194" stroke="var(--grid)"/>
<text class="muted number" x="612.0" y="211" font-size="12" text-anchor="middle">30</text>
<text class="muted" x="395.0" y="232" font-size="13" text-anchor="middle">Wall time (ms) · lower is better</text>
<text x="26" y="109" font-size="15" font-weight="600">keel asm</text>
<path d="M178.0 104H281.9" stroke="var(--keel)" stroke-width="12"/>
<text class="number" x="694" y="109" font-size="14" text-anchor="end" font-weight="600">7.18 ms</text>
<text x="26" y="145" font-size="15">clang -cc1as</text>
<path d="M178.0 140H462.1" stroke="var(--other)" stroke-width="12"/>
<text class="number" x="694" y="145" font-size="14" text-anchor="end">19.6 ms</text>
<text x="26" y="181" font-size="15">clang -c</text>
<path d="M178.0 176H558.2" stroke="var(--other)" stroke-width="12"/>
<text class="number" x="694" y="181" font-size="14" text-anchor="end">26.3 ms</text>
</svg>

<text class="muted number" x="438.4" y="247" font-size="12" text-anchor="middle">1.5</text>
<path d="M525.2 86V230" stroke="var(--grid)"/>
<text class="muted number" x="525.2" y="247" font-size="12" text-anchor="middle">2</text>

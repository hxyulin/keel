<svg xmlns="http://www.w3.org/2000/svg" width="720" height="282" viewBox="0 0 720 282" role="img" aria-labelledby="ir-object-t ir-object-d">
<style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink-2:#52514e;--grid:#e4e3df;--keel:#2a78d6;--other:#a3a29b}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink-2:#c3c2b7;--grid:#3a3935;--keel:#3987e5;--other:#6f6e68}}
text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;fill:var(--ink)}
.muted{fill:var(--ink-2)}
</style>
<title id="ir-object-t">Keel IR → object file (backend only) (lower is better)</title>
<desc id="ir-object-d">Keel baseline: 415 µs; Keel full: 474 µs; Cranelift none: 765 µs; Cranelift speed: 1040 µs. Keel full is 2.2× faster than Cranelift speed. Apple M5 Max · macOS 27, median of 7 runs.</desc>

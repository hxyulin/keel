<svg xmlns="http://www.w3.org/2000/svg" width="720" height="283" viewBox="0 0 720 283" role="img" aria-labelledby="ir-object-t ir-object-d">
<style>
svg{--surface:#fff;--ink:#000;--ink-2:#525252;--grid:#e5e5e5;--keel:#0056d6;--other:#737373;--on-blue:#fff}
@media (prefers-color-scheme:dark){svg{--surface:#000;--ink:#fff;--ink-2:#a3a3a3;--grid:#262626;--keel:#5b9dff;--other:#737373;--on-blue:#000}}
text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;fill:var(--ink)}
.muted{fill:var(--ink-2)}
.number{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums}
</style>
<title id="ir-object-t">Optimized Keel IR to object (lower is better)</title>
<desc id="ir-object-d">Keel baseline: 1.48 ms; Keel full: 1.53 ms; Cranelift none: 1.84 ms; Cranelift speed: 2.48 ms. Keel full is 1.6× faster than Cranelift speed. Core i7-1360P · Linux, 7 in-process runs.</desc>

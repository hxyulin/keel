# The build configurations, in the order result tables list them.

# Benchmark ratios are against this configuration.
baseline = "clang-O0"
# What `keel-suite test` builds when no `--config` is given.
test = ["keel", "keel-O", "keel-select", "keel-O-select"]

[[config]]
name = "clang-O0"
compiler = "clang"
flags = ["-O0"]

[[config]]
name = "clang-O0-g"
compiler = "clang"
flags = ["-O0", "-g"]

[[config]]
name = "clang-O1"
compiler = "clang"
flags = ["-O1"]

[[config]]
name = "clang-O2"
compiler = "clang"
flags = ["-O2"]

[[config]]
name = "clang-O3"
compiler = "clang"
flags = ["-O3"]

[[config]]
name = "keel"
compiler = "keel"

[[config]]
name = "keel-g"
compiler = "keel"
flags = ["-g"]

[[config]]
name = "keel-O"
compiler = "keel"
flags = ["-O"]

# Optional target selection; individual passes support ablation measurements.
[[config]]
name = "keel-select"
compiler = "keel"
flags = ["--isel", "all"]

[[config]]
name = "keel-O-select"
compiler = "keel"
flags = ["-O", "--isel", "all"]

[[config]]
name = "keel-O-trees"
compiler = "keel"
flags = ["-O", "--isel", "trees"]

[[config]]
name = "keel-O-folds"
compiler = "keel"
flags = ["-O", "--isel", "folds"]

[[config]]
name = "keel-O-hints"
compiler = "keel"
flags = ["-O", "--isel", "hints"]

# Independently selectable effort presets; opt-in for benchmark comparisons.
[[config]]
name = "keel-basic"
compiler = "keel"
flags = ["--opt-tier", "basic", "--isel-tier", "baseline", "--regalloc", "full"]

[[config]]
name = "keel-fast"
compiler = "keel"
flags = ["--opt-tier", "basic", "--isel-tier", "baseline", "--regalloc", "fast"]

[[config]]
name = "keel-full"
compiler = "keel"
flags = ["--opt-tier", "full", "--isel-tier", "full", "--regalloc", "full"]

# The build configurations, in the order result tables list them.

# Benchmark ratios are against this configuration.
baseline = "clang-O0"
# What `keel-suite test` builds when no `--config` is given.
test = ["keel", "keel-O", "keel-select", "keel-O-select"]

[[config]]
name = "clang-O0"
compiler = "clang"
flags = ["-O0"]

[[config]]
name = "clang-O0-g"
compiler = "clang"
flags = ["-O0", "-g"]

[[config]]
name = "clang-O1"
compiler = "clang"
flags = ["-O1"]

[[config]]
name = "clang-O2"
compiler = "clang"
flags = ["-O2"]

[[config]]
name = "clang-O3"
compiler = "clang"
flags = ["-O3"]

[[config]]
name = "keel"
compiler = "keel"

[[config]]
name = "keel-g"
compiler = "keel"
flags = ["-g"]

[[config]]
name = "keel-O"
compiler = "keel"
flags = ["-O"]

# Optional target selection; individual passes support ablation measurements.
[[config]]
name = "keel-select"
compiler = "keel"
flags = ["--isel", "all"]

[[config]]
name = "keel-O-select"
compiler = "keel"
flags = ["-O", "--isel", "all"]

[[config]]
name = "keel-O-trees"
compiler = "keel"
flags = ["-O", "--isel", "trees"]

[[config]]
name = "keel-O-folds"
compiler = "keel"
flags = ["-O", "--isel", "folds"]

[[config]]
name = "keel-O-hints"
compiler = "keel"
flags = ["-O", "--isel", "hints"]

# Independently selectable effort presets; opt-in for benchmark comparisons.
[[config]]
name = "keel-basic"
compiler = "keel"
flags = ["--opt-tier", "basic", "--isel-tier", "baseline", "--regalloc", "full"]

[[config]]
name = "keel-fast"
compiler = "keel"
flags = ["--opt-tier", "basic", "--isel-tier", "baseline", "--regalloc", "fast"]

[[config]]
name = "keel-full"
compiler = "keel"
flags = ["--opt-tier", "full", "--isel-tier", "full", "--regalloc", "full"]

# SCCP adds propagation before instruction combining.
# Opt-in until measurements justify changing the default pipelines.
[[config]]
name = "keel-basic-sccp"
compiler = "keel"
flags = ["-p", "simplify-cfg,sccp,instcombine,simplify-cfg,dce"]

[[config]]
name = "keel-O-sccp"
compiler = "keel"
flags = ["-p", "simplify-cfg,sccp,instcombine,simplify-cfg,gvn,dce,gcm"]

[[config]]
name = "keel-O-combine"
compiler = "keel"
flags = ["-p", "simplify-cfg,instcombine,simplify-cfg,gvn,dce,gcm"]

[[config]]
name = "keel-O-phi"
compiler = "keel"
flags = ["-p", "simplify-cfg,instcombine,phi-simplify,simplify-cfg,gvn,phi-simplify,dce,gcm"]

# Historical numeric-fold-only Full pipeline, retained for comparisons.
[[config]]
name = "keel-O-legacy"
compiler = "keel"
flags = ["-p", "simplify-cfg,const-fold,simplify-cfg,gvn,dce,gcm"]

# Cleanup after code motion avoids the early phi/GVN/GCM runtime regression.
[[config]]
name = "keel-O-phi-late"
compiler = "keel"
flags = ["-p", "simplify-cfg,instcombine,simplify-cfg,gvn,dce,gcm,phi-simplify"]

# Conservative block-local memory optimization, measured independently.
[[config]]
name = "keel-O-memory"
compiler = "keel"
flags = ["-p", "simplify-cfg,instcombine,simplify-cfg,gvn,memory-forward,dce,gcm"]

[[config]]
name = "keel-O-memory-select"
compiler = "keel"
flags = ["-p", "simplify-cfg,instcombine,simplify-cfg,gvn,memory-forward,dce,gcm", "--isel", "all"]

# Explicit M5 tuning: selection effort and ISA target remain independent.
[[config]]
name = "keel-m5"
compiler = "keel"
flags = ["-O", "--isel-tier", "full", "--tune", "apple-m5"]

[[config]]
name = "keel-m5-fast"
compiler = "keel"
flags = ["-O", "--isel-tier", "full", "--tune", "apple-m5", "--regalloc", "fast"]

# Simplification breadth and phase-order experiments.
[[config]]
name = "keel-O-cleanup"
compiler = "keel"
flags = ["-p", "simplify-cfg,instcombine,simplify-cfg,gvn,instcombine,simplify-cfg,dce,gcm"]

[[config]]
name = "keel-O-bits-early"
compiler = "keel"
flags = ["-p", "simplify-cfg,known-bits,instcombine,simplify-cfg,gvn,dce,gcm"]

[[config]]
name = "keel-O-bits-late"
compiler = "keel"
flags = ["-p", "simplify-cfg,instcombine,simplify-cfg,gvn,known-bits,instcombine,simplify-cfg,dce,gcm"]

[[config]]
name = "keel-O-bits-repeat"
compiler = "keel"
flags = ["-p", "simplify-cfg,instcombine,simplify-cfg,gvn,known-bits,instcombine,simplify-cfg,dce,gvn,known-bits,instcombine,simplify-cfg,dce,gcm"]

# Conditional-edge integer facts; opt-in while measured against Full.
[[config]]
name = "keel-O-ranges"
compiler = "keel"
flags = ["-p", "canonicalize,simplify-cfg,instcombine,simplify-cfg,gvn,branch-ranges,instcombine,simplify-cfg,dce,gcm"]

# Combined scalar analyses after value numbering, with CFG canonicalization first.
[[config]]
name = "keel-O-facts"
compiler = "keel"
flags = ["-p", "simplify-cfg,canonicalize,instcombine,simplify-cfg,gvn,known-bits,branch-ranges,instcombine,simplify-cfg,dce,gcm"]
